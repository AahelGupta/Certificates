<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
  <defs>
    <style>
      .css-shield { animation: waveCSS 3s ease-in-out infinite; transform-origin: 32px 32px; }
      .wave-bar1 { animation: wavePulse 1.8s ease-in-out infinite; }
      .wave-bar2 { animation: wavePulse 1.8s ease-in-out infinite 0.4s; }
      .wave-bar3 { animation: wavePulse 1.8s ease-in-out infinite 0.8s; }
      @keyframes waveCSS {
        0%, 100% { transform: rotate(0deg) scale(1); filter: drop-shadow(0 0 3px #0288D1); }
        50% { transform: rotate(2deg) scale(1.04); filter: drop-shadow(0 0 9px #29B6F6); }
      }
      @keyframes wavePulse {
        0%, 100% { opacity: 0.6; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-2px); }
      }
    </style>
  </defs>
  <g class="css-shield">
    <path d="M14 10 L18 52 L32 56 L46 52 L50 10 Z" fill="#0277BD"/>
    <path d="M32 13 L47 13 L43 49 L32 52 Z" fill="#0288D1"/>
    <!-- 3 Symbol -->
    <path d="M22 20 L42 20 L41 26 L30 26 L30.5 31 L41 31 L39.5 44 L32 46.5 L24.5 44 L25 38 L30 38 L30.5 41 L32 41.5 L34.5 41 L35.5 35 L23 35 Z" fill="#FFFFFF"/>
  </g>
  <!-- Floating Wave Accent Bars -->
  <rect class="wave-bar1" x="6" y="16" width="4" height="2" rx="1" fill="#4FC3F7"/>
  <rect class="wave-bar2" x="4" y="24" width="6" height="2" rx="1" fill="#81D4FA"/>
  <rect class="wave-bar3" x="54" y="20" width="5" height="2" rx="1" fill="#4FC3F7"/>
</svg>