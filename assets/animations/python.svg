<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
  <defs>
    <linearGradient id="pyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#387EB8"/>
      <stop offset="100%" stop-color="#2D5C88"/>
    </linearGradient>
    <linearGradient id="pyYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE873"/>
      <stop offset="100%" stop-color="#FFD43B"/>
    </linearGradient>
    <style>
      .py-group { animation: pyGlide 3.5s ease-in-out infinite; transform-origin: 32px 32px; }
      .eye-blink1 { animation: eyeBlink 3s infinite; }
      .eye-blink2 { animation: eyeBlink 3s infinite 1.5s; }
      @keyframes pyGlide {
        0%, 100% { transform: rotate(0deg) scale(1); filter: drop-shadow(0 0 3px #387EB8); }
        50% { transform: rotate(4deg) scale(1.05); filter: drop-shadow(0 0 8px #FFD43B); }
      }
      @keyframes eyeBlink {
        0%, 45%, 55%, 100% { transform: scale(1); }
        50% { transform: scale(0.1); }
      }
    </style>
  </defs>
  <g class="py-group">
    <!-- Blue snake (top) -->
    <path d="M31 10 C22 10 21 14 21 14 L21 19 L32 19 L32 21 L16 21 C16 21 10 21 10 30 C10 38 15 37 15 37 L19 37 L19 32 C19 27 24 26 29 26 L38 26 C41 26 44 23 44 19 C44 13 39 10 31 10 Z" fill="url(#pyBlue)"/>
    <circle class="eye-blink1" cx="25" cy="15" r="1.8" fill="#FFFFFF"/>
    <!-- Yellow snake (bottom) -->
    <path d="M33 54 C42 54 43 50 43 50 L43 45 L32 45 L32 43 L48 43 C48 43 54 43 54 34 C54 26 49 27 49 27 L45 27 L45 32 C45 37 40 38 35 38 L26 38 C23 38 20 41 20 45 C20 51 25 54 33 54 Z" fill="url(#pyYellow)"/>
    <circle class="eye-blink2" cx="39" cy="49" r="1.8" fill="#1E293B"/>
  </g>
</svg>