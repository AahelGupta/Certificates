<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
  <defs>
    <style>
      .dj-box { animation: djGlow 2.8s ease-in-out infinite; transform-origin: 32px 32px; }
      .radar-sweep { animation: sweepDiagonal 2.5s ease-in-out infinite; }
      @keyframes djGlow {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #092E20); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 8px #10B981); }
      }
      @keyframes sweepDiagonal {
        0% { transform: translateX(-30px); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: translateX(30px); opacity: 0; }
      }
    </style>
    <clipPath id="djClip">
      <rect x="12" y="12" width="40" height="40" rx="8"/>
    </clipPath>
  </defs>
  <g class="dj-box">
    <rect x="12" y="12" width="40" height="40" rx="8" fill="#092E20" stroke="#10B981" stroke-width="1.5"/>
    <!-- Shimmer Bar -->
    <g clip-path="url(#djClip)">
      <rect class="radar-sweep" x="20" y="8" width="10" height="48" fill="#34D399" transform="rotate(25 32 32)"/>
    </g>
    <!-- DJ Text -->
    <path d="M22 24 L27 24 L27 38 C27 41 25 43 21 43 C19 43 17 42 16 41 L18 38 C19 39 20 40 21 40 C23 40 23 39 23 37 L23 24 Z" fill="#FFFFFF"/>
    <path d="M31 30 L35 30 L35 43 L31 43 Z M31 24 L35 24 L35 27 L31 27 Z" fill="#FFFFFF"/>
    <path d="M43 30 L43 43 C43 47 40 49 36 49 L34 46 C36 46 38 45 38 43 L38 41 C37 42 36 43 34 43 C31 43 29 40 29 36 C29 32 31 30 34 30 C36 30 37 31 38 32 L38 30 Z M36 33 C34 33 33 34 33 36 C33 38 34 40 36 40 C38 40 39 38 39 36 C39 34 38 33 36 33 Z" fill="#FFFFFF"/>
  </g>
</svg>