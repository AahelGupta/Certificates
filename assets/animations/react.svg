<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
  <defs>
    <style>
      .atom-center { animation: corePulse 2s ease-in-out infinite; transform-origin: 32px 32px; }
      .orbit1 { animation: spinOrbit1 6s linear infinite; transform-origin: 32px 32px; }
      .orbit2 { animation: spinOrbit2 8s linear infinite; transform-origin: 32px 32px; }
      .orbit3 { animation: spinOrbit3 10s linear infinite; transform-origin: 32px 32px; }
      @keyframes corePulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px #00D8FF); }
        50% { transform: scale(1.3); filter: drop-shadow(0 0 9px #61DAFB); }
      }
      @keyframes spinOrbit1 {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spinOrbit2 {
        0% { transform: rotate(60deg); }
        100% { transform: rotate(420deg); }
      }
      @keyframes spinOrbit3 {
        0% { transform: rotate(120deg); }
        100% { transform: rotate(480deg); }
      }
    </style>
  </defs>
  <g class="orbit1">
    <ellipse cx="32" cy="32" rx="24" ry="9" fill="none" stroke="#00D8FF" stroke-width="2"/>
    <circle cx="56" cy="32" r="2.5" fill="#61DAFB"/>
  </g>
  <g class="orbit2">
    <ellipse cx="32" cy="32" rx="24" ry="9" fill="none" stroke="#00D8FF" stroke-width="2"/>
    <circle cx="56" cy="32" r="2.5" fill="#61DAFB"/>
  </g>
  <g class="orbit3">
    <ellipse cx="32" cy="32" rx="24" ry="9" fill="none" stroke="#00D8FF" stroke-width="2"/>
    <circle cx="56" cy="32" r="2.5" fill="#61DAFB"/>
  </g>
  <circle class="atom-center" cx="32" cy="32" r="4.5" fill="#00D8FF"/>
</svg>