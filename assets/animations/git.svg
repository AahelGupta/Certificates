<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
  <defs>
    <style>
      .git-diamond { animation: gitWiggle 3s ease-in-out infinite; transform-origin: 32px 32px; }
      .branch-pulse { animation: branchGlow 2s ease-in-out infinite alternate; }
      @keyframes gitWiggle {
        0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 3px #F05032); }
        50% { transform: scale(1.05) rotate(2deg); filter: drop-shadow(0 0 9px #FF7A59); }
      }
      @keyframes branchGlow {
        0% { stroke: #FFFFFF; }
        100% { stroke: #FED7AA; filter: drop-shadow(0 0 3px #FFEDD5); }
      }
    </style>
  </defs>
  <g class="git-diamond">
    <rect x="14" y="14" width="36" height="36" rx="8" fill="#F05032" transform="rotate(45 32 32)"/>
    <!-- Branch Graph -->
    <g class="branch-pulse">
      <line x1="24" y1="26" x2="24" y2="42" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M24 34 Q32 34 38 28" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="24" cy="26" r="3" fill="#FFFFFF"/>
      <circle cx="24" cy="42" r="3" fill="#FFFFFF"/>
      <circle cx="38" cy="28" r="3" fill="#FFFFFF"/>
    </g>
  </g>
</svg>