<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
  <defs>
    <style>
      .ang-shield { animation: angularBeat 2.4s ease-in-out infinite; transform-origin: 32px 32px; }
      .a-letter { animation: aGlow 1.8s ease-in-out infinite alternate; }
      .ray-ping { animation: rayPulse 2s ease-in-out infinite; transform-origin: 32px 32px; }
      @keyframes angularBeat {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px #DD0031); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 10px #FF3366); }
      }
      @keyframes aGlow {
        0% { fill: #FFFFFF; filter: drop-shadow(0 0 1px #FFF); }
        100% { fill: #FFF0F5; filter: drop-shadow(0 0 4px #FFAEC9); }
      }
      @keyframes rayPulse {
        0%, 100% { opacity: 0.2; transform: scale(0.9); }
        50% { opacity: 0.8; transform: scale(1.1); }
      }
    </style>
  </defs>
  <polygon class="ray-ping" points="32,4 58,16 48,48 32,58 16,48 6,16" fill="none" stroke="#FF5370" stroke-width="1"/>
  <g class="ang-shield">
    <polygon points="32,8 54,18 46,46 32,54 18,46 10,18" fill="#DD0031"/>
    <polygon points="32,8 54,18 46,46 32,54 32,10" fill="#C3002F"/>
    <!-- Letter A -->
    <path class="a-letter" d="M32 16 L20 44 L25 44 L28 36 L36 36 L39 44 L44 44 Z M32 23 L34.5 31 L29.5 31 Z"/>
  </g>
</svg>