<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
  <defs>
    <style>
      .ruby-gem { animation: rubyShimmer 2.6s ease-in-out infinite; transform-origin: 32px 32px; }
      .sparkle-facet { animation: glint 1.8s ease-in-out infinite alternate; }
      @keyframes rubyShimmer {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px #CC342D); }
        50% { transform: scale(1.07); filter: drop-shadow(0 0 10px #FF4D4D); }
      }
      @keyframes glint {
        0% { opacity: 0.3; }
        100% { opacity: 1; fill: #FFFFFF; }
      }
    </style>
  </defs>
  <g class="ruby-gem">
    <!-- Top flat -->
    <polygon points="20,16 44,16 54,28 32,52 10,28" fill="#991B1B"/>
    <!-- Facets -->
    <polygon points="20,16 44,16 38,24 26,24" fill="#DC2626"/>
    <polygon points="20,16 26,24 18,28 10,28" fill="#EF4444"/>
    <polygon points="44,16 54,28 46,28 38,24" fill="#B91C1C"/>
    <polygon points="26,24 38,24 32,52" fill="#E11D48"/>
    <polygon points="18,28 26,24 32,52 10,28" fill="#F43F5E"/>
    <polygon points="46,28 38,24 32,52 54,28" fill="#BE123C"/>
    <!-- Highlight glint -->
    <polygon class="sparkle-facet" points="26,24 32,24 30,30 24,28" fill="#FDA4AF"/>
  </g>
</svg>