<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
  <defs>
    <style>
      .node-hex { animation: hexPulse 2.5s ease-in-out infinite; transform-origin: 32px 32px; }
      .matrix-line { animation: matrixFlow 2s linear infinite; stroke-dasharray: 4,3; }
      .corner-dot { animation: dotPing 1.8s ease-in-out infinite alternate; }
      @keyframes hexPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px #539E43); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 10px #68A063); }
      }
      @keyframes matrixFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 14; }
      }
      @keyframes dotPing {
        0% { transform: scale(0.8); opacity: 0.5; }
        100% { transform: scale(1.3); opacity: 1; }
      }
    </style>
  </defs>
  <g class="node-hex">
    <polygon points="32,8 54,20 54,44 32,56 10,44 10,20" fill="#333333" stroke="#68A063" stroke-width="2"/>
    <polygon points="32,14 48,24 48,42 32,50 16,42 16,24" fill="#222222"/>
    <!-- Node N -->
    <path d="M22 24 L32 36 L32 24 L36 24 L36 40 L26 28 L26 40 L22 40 Z" fill="#68A063"/>
  </g>
  <line class="matrix-line" x1="10" y1="20" x2="32" y2="8" stroke="#8BC34A" stroke-width="1.5"/>
  <circle class="corner-dot" cx="32" cy="8" r="2.5" fill="#8BC34A"/>
  <circle class="corner-dot" cx="54" cy="44" r="2" fill="#8BC34A" style="animation-delay: 0.6s;"/>
</svg>