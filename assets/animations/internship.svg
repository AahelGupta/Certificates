<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .medal-body { animation: floatMedal 3s ease-in-out infinite; transform-origin: 32px 32px; }
      .star-pulse { animation: starPulse 1.8s ease-in-out infinite; transform-origin: 32px 34px; }
      .ray-spin { animation: spinRays 8s linear infinite; transform-origin: 32px 34px; }
      .sparkle { animation: sparkleTwinkle 2s ease-in-out infinite alternate; }
      @keyframes floatMedal {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes starPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #FDE68A); }
        50% { transform: scale(1.15); filter: drop-shadow(0 0 6px #FBBF24); }
      }
      @keyframes spinRays {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes sparkleTwinkle {
        0% { opacity: 0.3; transform: scale(0.7); }
        100% { opacity: 1; transform: scale(1.3); }
      }
    </style>
  </defs>
  <g class="medal-body">
    <!-- Ribbon -->
    <path d="M22 6 L32 20 L42 6 L36 4 L28 4 Z" fill="#EF4444"/>
    <path d="M25 6 L32 16 L39 6" fill="#DC2626"/>
    <!-- Background Ray Burst -->
    <g class="ray-spin" stroke="#FDE68A" stroke-width="1.5" opacity="0.6">
      <line x1="32" y1="20" x2="32" y2="16"/>
      <line x1="32" y1="48" x2="32" y2="52"/>
      <line x1="18" y1="34" x2="14" y2="34"/>
      <line x1="46" y1="34" x2="50" y2="34"/>
      <line x1="22" y1="24" x2="19" y2="21"/>
      <line x1="42" y1="44" x2="45" y2="47"/>
      <line x1="22" y1="44" x2="19" y2="47"/>
      <line x1="42" y1="24" x2="45" y2="21"/>
    </g>
    <!-- Medal Outer Circle -->
    <circle cx="32" cy="34" r="16" fill="url(#goldGrad)" filter="url(#glowGold)" stroke="#FFFBEB" stroke-width="1.5"/>
    <circle cx="32" cy="34" r="13" fill="none" stroke="#D97706" stroke-width="1" stroke-dasharray="2,2"/>
    <!-- Star -->
    <path class="star-pulse" d="M32 26 L34.5 31.5 L40.5 32 L36 36 L37.5 42 L32 38.8 L26.5 42 L28 36 L23.5 32 L29.5 31.5 Z" fill="#FFFFFF"/>
    <!-- Sparkles -->
    <circle class="sparkle" cx="16" cy="18" r="1.5" fill="#FDE047"/>
    <circle class="sparkle" cx="48" cy="20" r="1.5" fill="#FDE047" style="animation-delay: 1s;"/>
  </g>
</svg>