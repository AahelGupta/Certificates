<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
  <defs>
    <style>
      .js-box { animation: jsPulse 2.2s ease-in-out infinite; transform-origin: 32px 32px; }
      .spark { animation: sparkRotate 4s linear infinite; transform-origin: 32px 32px; }
      .bolt { animation: boltFlash 1.5s ease-in-out infinite; }
      @keyframes jsPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px #EAB308); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 9px #FACC15); }
      }
      @keyframes sparkRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes boltFlash {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px #FDE047); }
      }
    </style>
  </defs>
  <g class="spark" opacity="0.7">
    <circle cx="32" cy="6" r="2" fill="#FACC15"/>
    <circle cx="58" cy="32" r="2" fill="#FACC15"/>
    <circle cx="32" cy="58" r="2" fill="#FACC15"/>
    <circle cx="6" cy="32" r="2" fill="#FACC15"/>
  </g>
  <g class="js-box">
    <rect x="12" y="12" width="40" height="40" rx="8" fill="#F7DF1E"/>
    <!-- JS Letters -->
    <path d="M22 34 L26 34 C28 34 29 35 29 37 L29 42 C29 44 27 46 24 46 C21 46 19 44 19 42 L22 42 C22 43 23 44 24 44 C25 44 26 43 26 42 L26 37 L22 37 Z" fill="#000000"/>
    <path d="M33 42 C33 44 35 46 38 46 C41 46 43 44 43 42 C43 39 41 38 38 37 C35 36 33 35 33 33 C33 31 35 29 38 29 C41 29 43 31 43 33 L40 33 C40 32 39 31 38 31 C36 31 36 32 36 33 C36 34 37 35 39 35 C42 36 45 37 45 40 C45 44 42 46 38 46 C34 46 31 43 31 40 Z" fill="#000000"/>
  </g>
  <polygon class="bolt" points="48,8 44,14 47,14 43,20 50,13 47,13" fill="#FACC15"/>
</svg>